name: agendamento

services:
  agendamento-api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      TRUST_PROXY: 1
      DATABASE_URL: postgresql://agendamento_prod_app:${DB_PASSWORD:?defina DB_PASSWORD no .env}@${DB_HOST:?defina DB_HOST no .env}:5432/agendamento_prod?schema=public
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      FRONTEND_URL: ${FRONTEND_URL:?defina FRONTEND_URL no .env}
    networks:
      - dev-network
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3001/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  agendamento-web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?defina NEXT_PUBLIC_API_URL no .env}
    restart: unless-stopped
    networks:
      - dev-network

  # Tarefas pontuais (migrations e seed): docker compose run --rm agendamento-migrate <comando>
  agendamento-migrate:
    build:
      context: ./backend
      target: builder
    profiles: ['tools']
    environment:
      DATABASE_URL: postgresql://agendamento_prod_app:${DB_PASSWORD:?defina DB_PASSWORD no .env}@${DB_HOST:?defina DB_HOST no .env}:5432/agendamento_prod?schema=public
      SHADOW_DATABASE_URL: postgresql://agendamento_prod_app:${DB_PASSWORD}@${DB_HOST}:5432/agendamento_sem_shadow?schema=public
    command: npx prisma migrate deploy
    networks:
      - dev-network

networks:
  dev-network:
    external: true
