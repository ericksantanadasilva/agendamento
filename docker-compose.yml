services:
  postgres:
    image: postgres:16-alpine
    container_name: agendamento-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-agendamento_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-agendamento_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agendamento-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agendamento-api
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-agendamento_db}?schema=public
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agendamento-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agendamento-web
    restart: unless-stopped
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - agendamento-network

volumes:
  postgres_data:
    name: agendamento_postgres_data

networks:
  agendamento-network:
    name: agendamento_network
    driver: bridge
